# Conda environment for ppol. From the repository root:
#   conda env create -f environment.yml
#   conda activate ppol
#
# For the τ²-bench example, also install τ²-bench:
#   pip install git+https://github.com/sierra-research/tau2-bench

name: ppol
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - -e .
    - pytest>=8.0
