# Shared hyperparameters for all SFT runs.
# Per-run YAMLs override only: dataset, eval_dataset, output_dir, max_steps.
model_name_or_path: google/gemma-4-31b-it
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

dataset_dir: data
template: gemma4_text
cutoff_len: 16384
overwrite_cache: true
preprocessing_num_workers: 1

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

logging_steps: 2
save_strategy: steps
plot_loss: true
overwrite_output_dir: true

do_eval: true
eval_strategy: steps
eval_steps: 8
per_device_eval_batch_size: 1
